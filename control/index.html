<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM ADMIN | TUNU JOURNAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/resources/base/base.js"></script>
    <style>
        :root { --bg: #f8fafc; --panel: #ffffff; --text: #0f172a; }
        .dark { --bg: #0f172a; --panel: #1e293b; --text: #f1f5f9; }
        body { background-color: var(--bg); color: var(--text); transition: background 0.2s; font-family: 'Inter', sans-serif; }
        .panel { background-color: var(--panel); border: 1px solid #334155; }
        .status-badge { padding: 2px 8px; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; border: 1px solid currentColor; }
        .tab-btn.active { border-bottom: 2px solid #3b82f6; color: #3b82f6; }
    </style>
</head>
<body class="flex min-h-screen">

    <aside class="w-64 border-r border-slate-200 p-6 flex flex-col gap-8">
        <div class="text-xl font-black">TUNU <span class="text-blue-500">ADMIN</span></div>
        <nav class="flex flex-col gap-4 text-sm font-semibold">
            <a href="#" class="text-blue-500"><i class="fas fa-database mr-2"></i> Submissions</a>
            <a href="#" class="opacity-50 hover:opacity-100"><i class="fas fa-users mr-2"></i> Contributors</a>
            <a href="#" class="opacity-50 hover:opacity-100"><i class="fas fa-gear mr-2"></i> Configuration</a>
        </nav>
    </aside>

    <main class="flex-1 p-8">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold">Dashboard</h1>
            <div class="flex gap-4 items-center">
                <button onclick="toggleTheme()" class="text-sm font-bold border px-3 py-1">TOGGLE THEME</button>
                <div class="w-8 h-8 bg-slate-200 rounded-full"></div>
            </div>
        </header>

        <section class="panel p-6 mb-8">
            <h2 class="text-xs font-bold uppercase mb-4 opacity-70">Global Settings</h2>
            <div class="grid grid-cols-3 gap-6 text-sm">
                <div>
                    <label class="block text-xs font-bold mb-2">Display Density</label>
                    <select class="w-full bg-transparent border p-2">
                        <option>Comfortable</option>
                        <option>Compact</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-2">Auto-Refresh Interval</label>
                    <select class="w-full bg-transparent border p-2">
                        <option>Disabled</option>
                        <option>30 seconds</option>
                        <option>5 minutes</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button class="bg-blue-600 text-white px-6 py-2 w-full text-xs font-bold uppercase">Save Config</button>
                </div>
            </div>
        </section>

        <section class="panel p-6">
            <div class="flex gap-4 mb-6 border-b border-slate-700/20">
                <button class="tab-btn active px-4 py-2 text-xs font-bold uppercase" onclick="setFilter('All', this)">All</button>
                <button class="tab-btn px-4 py-2 text-xs font-bold uppercase" onclick="setFilter('Pending', this)">Pending</button>
                <button class="tab-btn px-4 py-2 text-xs font-bold uppercase" onclick="setFilter('Approved', this)">Approved</button>
            </div>

            <table class="w-full text-sm">
                <thead class="text-left opacity-50">
                    <tr>
                        <th class="p-3"><input type="checkbox"></th>
                        <th class="p-3">Author</th>
                        <th class="p-3">Title</th>
                        <th class="p-3">Status</th>
                        <th class="p-3">Actions</th>
                    </tr>
                </thead>
                <tbody id="admin-list"></tbody>
            </table>
        </section>
    </main>

    <script>
        const API_BASE = window.API_URL || '';
        let submissions = [];

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
        }

        async function init() {
            try {
                const res = await fetch(`${API_BASE}/admin/submissions`);
                submissions = await res.json();
                render();
            } catch(e) { console.error(e); }
        }

        function render() {
            document.getElementById('admin-list').innerHTML = submissions.map(s => `
                <tr class="border-t border-slate-700/10">
                    <td class="p-3"><input type="checkbox"></td>
                    <td class="p-3">${s.author_email}</td>
                    <td class="p-3 font-medium">${s.title}</td>
                    <td class="p-3"><span class="status-badge ${s.status === 'Approved' ? 'text-green-500' : 'text-yellow-500'}">${s.status}</span></td>
                    <td class="p-3 italic opacity-50 text-xs">View | Edit | Delete</td>
                </tr>
            `).join('');
        }

        init();
    </script>
</body>
</html>
