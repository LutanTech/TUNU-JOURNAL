<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tunu Journal | Coming Soon</title>
    <style>
        body {
            background-color:rgb(46, 46, 46);
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: sans-serif;
            background-image: url(/resources/bgs/11_09_2018_Textures5595A.jpg);
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }
        main{
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: stretch;
            width: 100%;
            height: 100%;
            flex-grow: 1;

            >div{
                flex-grow: 1;
            }
        }
        .b-img, .top-img{
            justify-content: center;
            flex-direction: column;
            display: flex;
            padding: 10px;
            align-items:center;
            background-image: url(/resources/bgs/cloudsmars@2x.png);
            background-position: bottom;
            background-repeat: no-repeat;
            background-size: contain;
            max-height: 150px;
        }
        .top-img{
            background-image: url(/resources/bgs/cloudsmoon@2x.png);
            background-position: top;
            position: relative;

        }
        h4{
            margin-top: 30px;
            color: rgb(255, 0, 242);
            text-shadow: 4px 0px 10px rgb(0, 0, 0);
            text-align: center;
            font-size: 0.5em;
        }
        .content{
            width: 95%;
            max-width: 1200px;
            margin: auto;
            border-radius: 20px;
            color: white;
            justify-content: center;
            align-items: center;
            display: flex;
            flex-direction: column;
            font-size: 3em;
            text-align: center;
        }
        #logo{
            margin: auto;
            width: 100px;
        }

    </style>
</head>
<body>
<main>
    <div class="top-img">
        <img id="logo" style="margin-top: 20px;" src="/resources/icons/tunu_logo.png" alt="">
    </div>
    <div class="content">
        <h4>TUNU PUBLISHERS JOURNAL</h4>
        <h2>COMING SOON</h2>
    </div>
    <div class="b-img">
    </div>

</main>
</body>
</html>
