<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASHBOARD | THE TUNU JOURNAL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/resources/base/base.js"></script>
    
    <style>
        :root { 
            --paper: #f9f7f2; --ink: #1a1a1a; --border: #d4d4d4; 
            --pending-bg: #fff3cd; --pending-text: #856404;
            --accepted-bg: #d4edda; --accepted-text: #155724;
            --rejected-bg: #f8d7da; --rejected-text: #721c24;
        }
        * { padding: 0; margin: 0; box-sizing: border-box; }
        body { font-family: 'Georgia', serif; background: #f0ede9; padding-top: 80px; color: var(--ink); line-height: 1.6; }
        
        header { position: fixed; top: 0; width: 100%; background: white; border-bottom: 1px solid var(--border); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
        .logo { font-weight: bold; letter-spacing: 2px; text-transform: uppercase; }
        .menu-toggle { display: none; cursor: pointer; font-size: 1.2rem; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { text-decoration: none; color: var(--ink); text-transform: uppercase; font-size: 0.8rem; font-family: sans-serif; }
        
        .container { max-width: 900px; margin: auto; padding: 20px; }
        .card { background: white; padding: 30px; border: 1px solid var(--border); margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        
        .badge { padding: 4px 10px; border-radius: 4px; font-family: sans-serif; font-size: 0.7rem; text-transform: uppercase; font-weight: bold; display: inline-block; }
        .status-pending { background: var(--pending-bg); color: var(--pending-text); }
        .status-accepted { background: var(--accepted-bg); color: var(--accepted-text); }
        .status-rejected { background: var(--rejected-bg); color: var(--rejected-text); }

        h1, h2 { font-weight: normal; margin-bottom: 20px; letter-spacing: 0.05em; text-transform: uppercase; border-bottom: 1px solid var(--ink); padding-bottom: 10px; }
        
        .profile-header { display: flex; align-items: center; gap: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .avatar { width: 60px; height: 60px; background: #e5e5e5; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #999; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; font-family: sans-serif; font-size: 0.7rem; text-transform: uppercase; padding: 10px; border-bottom: 2px solid var(--ink); }
        td { padding: 15px 10px; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
        
        .btn { display: inline-block; background: var(--ink); color: white; padding: 12px 24px; text-decoration: none; text-transform: uppercase; font-size: 0.8rem; border: none; cursor: pointer; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid var(--border); font-family: 'Georgia', serif; background: #fafafa; }
        
        .sub-actions { display: flex; gap: 15px; }
        #notify { position: fixed; top: 80px; right: 20px; padding: 15px; background: var(--ink); color: white; display: none; z-index: 100; border-radius: 4px; }

        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            .nav-links { display: none; position: absolute; top: 100%; left: 0; width: 100%; background: white; flex-direction: column; padding: 20px; border-bottom: 1px solid var(--border); gap: 15px; }
            .nav-links.active { display: flex; }
            th { display: none; }
            td { display: block; width: 100%; border-bottom: 1px solid #eee; position: relative; padding-left: 40%; }
            td::before { content: attr(data-label); position: absolute; left: 10px; font-weight: bold; font-size: 0.7rem; color: #777; text-transform: uppercase; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">The Tunu Journal</div>
        <div class="menu-toggle" onclick="document.querySelector('.nav-links').classList.toggle('active')"><i class="fas fa-bars"></i></div>
        <nav class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/">Archive</a>
            <a href="/logout">Logout</a>
        </nav>
    </header>

    <div id="notify"></div>
    <div class="container">
        <div class="card">
            <div class="profile-header">
                <div class="avatar"><i class="fas fa-user"></i></div>
                <div>
                    <h1 style="border:none; margin:0; font-size:1.5rem;">Author Profile</h1>
                    <p id="email" style="font-family: sans-serif; font-size: 0.8rem; color:#777;"></p>
                </div>
            </div>
            <div style="margin-top:20px;"><span style="display:block; font-family:sans-serif; font-size:0.7rem; color:#777;">Full Name</span> <span id="name"></span></div>
        </div>

        <div class="card">
            <h2>Submit New Manuscript</h2>
            <form id="uploadForm">
                <input type="text" id="title" placeholder="Manuscript Title" required>
                <textarea id="abstract" placeholder="Abstract" rows="4" required></textarea>
                <input type="file" id="pdf" accept="application/pdf" required>
                <button type="submit" class="btn">Upload Manuscript</button>
            </form>
        </div>

        <div class="card">
            <h2>My Submissions</h2>
            <table id="submissions-table">
                <thead><tr><th>ID</th><th>Title</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody id="submission-list"></tbody>
            </table>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const params = urlParams.get('params');
        const notifyEl = document.getElementById('notify');
        

        function notify(msg) {
            notifyEl.innerText = msg;
            notifyEl.style.display = 'block';
            setTimeout(() => notifyEl.style.display = 'none', 3000);
        }

        function getStatusBadge(status) {
            const s = status.toLowerCase();
            let cls = 'status-pending';
            if (s.includes('accept')) cls = 'status-accepted';
            if (s.includes('reject')) cls = 'status-rejected';
            return `<span class="badge ${cls}">${status}</span>`;
        }

        async function initDashboard() {
            if (!params) return window.location.href = '/login';
            try {
                const decoded = JSON.parse(atob(params.replace(/-/g, '+').replace(/_/g, '/')));
                document.getElementById('name').innerText = decoded.name;
                document.getElementById('email').innerText = decoded.email;
                window.token = decoded.token;
                loadSubmissions();
            } catch (e) { document.body.innerHTML = '<h1>Session Error</h1>'; }
        }

        async function loadSubmissions() {
            const res = await fetch(`${API_URL}/my-submissions`, { headers: { 'Authorization': window.token } });
            const subs = await res.json();
            const list = document.getElementById('submission-list');
            list.innerHTML = subs.map(s => `
                <tr>
                    <td data-label="ID">${s.id}</td>
                    <td data-label="Title">${s.title}</td>
                    <td data-label="Status">${getStatusBadge(s.status)}</td>
                    <td data-label="Actions" class="sub-actions">
                        <a href="${API_URL}/${s.pdf_url}?download=true" download><i class="fas fa-download"></i></a>
                        <a href="${API_URL}/${s.pdf_url}" target="_blank"><i class="fas fa-eye"></i></a>
                    </td>
                </tr>
            `).join('');
        }

        document.getElementById('uploadForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('title', document.getElementById('title').value);
            formData.append('abstract', document.getElementById('abstract').value);
            formData.append('pdf', document.getElementById('pdf').files[0]);

            const res = await fetch(`${API_URL}/submit?token=${window.token}`, { method: 'POST', body: formData });
            const data = await res.json();
            notify(data.message || 'Submission successful');
            loadSubmissions();
            e.target.reset();
        };

        initDashboard();
    </script>
</body>
</html>
