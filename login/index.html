<!DOCTYPE html>
<html lang="en">
<head>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
        <title>Tunu Journal Login</title>
        <meta name="description" content="Login to Tunu Journal. Access academic archives, submit articles, and manage your scholarly account securely.">
        <meta name="keywords" content="Tunu Journal, login, academic journal, research archive, university articles, scholar login">
        <meta name="author" content="Tunu Journal">
    
        <link rel="canonical" href="https://tunujournal.com/login">
    
        <!-- Open Graph -->
        <meta property="og:title" content="Tunu Journal Login">
        <meta property="og:description" content="Secure login to access academic archives and research submissions.">
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://tunujournal.com/login">
        <meta property="og:image" content="https://tunujournal.com/assets/icons/icon_nbg.png">
    
        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="Tunu Journal Login">
        <meta name="twitter:description" content="Secure access to Tunu Journal academic platform">
        <meta name="twitter:image" content="https://tunujournal.com/assets/icons/icon_nbg.png">
    
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <script src="/resources/base/base.js"></script>
    
        <link rel="shortcut icon" href="/assets/icons/icon_nbg.png" type="image/x-icon">
        <link rel="icon" href="/assets/icons/icon_nbg.png" type="image/x-icon">
    <style>
        :root {
            --paper: #f9f7f2;
            --ink: #1a1a1a;
            --border: #d4d4d4;
            --gold: #c5a059;
            --accent: #2c3e50;
            --card-bg: #ffffff;
            --success-color: #2e7d32;
            --success-bg: rgba(46, 125, 50, 0.1);
            --error-color: #c62828;
            --error-bg: rgba(198, 40, 40, 0.1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #121212;
                --ink: #e0e0e0;
                --border: #333333;
                --card-bg: #1e1e1e;
                --accent: #c5a059;
            }
        }

        * { 
            padding: 0px; 
            margin: 0; 
            box-sizing: border-box; 
        }

        body {
            width: 100%;
            min-height: 100vh;
            background: var(--paper);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', serif;
            color: var(--ink);
            padding: 16px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        #loginForm {
            background: var(--card-bg);
            padding: 28px 24px; /* Reduced from 40px - tighter padding */
            display: flex;
            flex-direction: column;
            gap: 14px; /* Reduced from 16px - tighter layout */
            width: 100%;
            max-width: 370px; /* Reduced from 480px - much narrower and crisp */
            border: 1px solid var(--border);
            border-radius: 4px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.04);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .logo-cont {
            width: 100%;
            margin-bottom: 2px;
            text-align: center;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgb(235, 234, 232);
            border: 1.5px solid var(--gold);
            border-radius: 50%;
            width: 50px; /* Slimmer logo size */
            height: 50px;
            color: var(--gold);
            font-size: 1.3rem;
            margin: 0 auto 10px auto;
        }

        .journal-title {
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 0.1em;
            color: var(--ink);
        }

        .divider {
            margin: 10px 0;
            border: none;
            border-top: 1px solid var(--border);
        }

        .login-tag {
            font-family: sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            color: var(--gold);
            margin-bottom: 2px;
        }

        .input-field { 
            position: relative; 
            width: 100%; 
        }

        .inp-icon { 
            position: absolute; 
            top: 50%; 
            transform: translateY(-50%);
            left: 12px; 
            color: var(--ink);
            opacity: 0.5;
            font-size: 0.9rem;
            transition: opacity 0.2s ease;
        }

        .inp {
            width: 100%;
        }

        .inp input {
            width: 100%;
            padding: 11px 12px 11px 36px; /* Tighter vertical/horizontal padding */
            background: var(--paper);
            color: var(--ink);
            border: 1px solid var(--border);
            border-radius: 3px;
            outline: none;
            font-family: sans-serif;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .inp input:focus { 
            border-color: var(--gold);
            background: var(--card-bg);
        }

        .inp input:focus + .inp-icon {
            opacity: 1;
            color: var(--gold);
        }

        .btn {
            background: var(--ink);
            color: var(--paper);
            padding: 11px; /* Leaner buttons */
            width: 100%;
            border: 1px solid var(--ink);
            border-radius: 3px;
            cursor: pointer;
            text-transform: uppercase;
            font-family: sans-serif;
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn:hover {
            background: var(--gold);
            border-color: var(--gold);
            color: #fff;
        }

        .btn:active { 
            transform: scale(0.98); 
        }

        .eye { 
            position: absolute; 
            top: 50%;
            transform: translateY(-50%);
            right: 12px; 
            cursor: pointer; 
            color: var(--ink);
            opacity: 0.5;
            padding: 4px;
            font-size: 0.95rem;
        }
        .eye:hover {
            opacity: 1;
        }

        .forgot-link-container {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            margin-top: -3px;
            margin-bottom: 2px;
        }

        .forgot-link-container a {
            font-family: sans-serif;
            font-size: 0.75rem;
            color: var(--ink);
            opacity: 0.7;
            text-decoration: none;
            transition: opacity 0.2s ease, color 0.2s ease;
        }

        .forgot-link-container a:hover {
            opacity: 1;
            color: var(--gold);
        }

        .page-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            margin-top: 2px;
        }

        .google-btn {
            text-decoration: none;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--ink);
            user-select: none;
        }
        .google-btn:hover {
            background: var(--paper);
            border-color: var(--ink);
            color: var(--ink);
        }

        button:disabled, a.btn:disabled {
            background: #888888 !important;
            border-color: #888888 !important;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .alertDiv {
            gap: 10px;
            padding: 9px 12px;
            border-radius: 3px;
            font-size: 0.8rem;
            display: none;
            align-items: center;
            width: 100%;
            font-family: sans-serif;
            line-height: 1.3;
        }

        .alertDiv.show {
            display: flex;
        }

        .alertDiv.error {
            color: var(--error-color);
            background: var(--error-bg);
            border: 1px solid var(--error-color);
        }

        .alertDiv.success {
            color: var(--success-color);
            background: var(--success-bg);
            border: 1px solid var(--success-color);
        }

        .alertIcon {
            font-size: 1rem;
        }
        
        .alertDiv.error .alertIcon {
            animation: swing 0.6s ease;
        }

        @keyframes swing {
            0%, 100% { transform: rotate(0deg); }
            20% { transform: rotate(12deg); }
            40% { transform: rotate(-12deg); }
            60% { transform: rotate(8deg); }
            80% { transform: rotate(-8deg); }
        }

        .footer { 
            margin-top: 14px; 
            text-align: center; 
            font-size: 0.7rem; 
            color: var(--ink);
            opacity: 0.5;
            border-top: 1px solid var(--border); 
            padding-top: 12px; 
            font-family: sans-serif;
        }

        @media (max-width: 400px) {
            #loginForm {
                padding: 22px 18px;
            }
        }
        .logo-img{
            height: 50px;
            border-radius: 50%;

        }
    </style>
</head>
<body>
    <form id="loginForm">
        <div class="logo-cont">
            <div class="logo">
               <img src="/assets/icons/icon.png" class="logo-img" alt="">
            </div>
            <div class="journal-title">THE TUNU JOURNAL</div>
            <hr class="divider">
            <div class="login-tag">Archival Sign In</div>
        </div>

        <!-- Custom Notification Alert Box -->
        <div class="alertDiv" id="alert-box">
            <div class="alertIcon" id="alert-icon">
                <i class="fas fa-bell"></i>
            </div>
            <div class="alertText" id="alert-text">
                All fields are required
            </div>
        </div>

        <div class="input-field">
            <div class="inp">
                <input type="email" id="email" placeholder="Scholar Email / ID" required>
                <i class="fas fa-envelope inp-icon"></i>
            </div>
        </div>

        <div class="input-field">
            <div class="inp">
                <input type="password" id="password" placeholder="Account Password" required>
                <i class="fas fa-lock inp-icon"></i>
            </div>
            <div class="eye" id="password-toggle"><i class="fas fa-eye"></i></div>
        </div>

        <div class="forgot-link-container">
            <a href="#" id="forgot-password-link">Forgot Password?</a>
        </div>
        
        <button class="btn submit" type="submit" id="submit-btn">
            <i class="fas fa-sign-in-alt"></i>            
            Authenticate Credentials
        </button>

        <div class="page-links">
            <a class="btn google-btn" href="/google/login/" id="google-btn">
                <i class="fab fa-google" style="color: #ea4335;"></i>
                Continue with Google
            </a>
            <a class="btn google-btn" href="/register" id="register-redirect">
                <i class="fas fa-user-plus" style="color: #c5a059;"></i>
                Register 
            </a>
        </div>

        <div class="footer">
            Tunu Journal &copy; 2026. All Rights Reserved.
        </div>
    </form>

    <script>
        const passwordToggle = document.getElementById('password-toggle');
        const passwordInput = document.getElementById('password');

        passwordToggle.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            passwordToggle.innerHTML = isPassword 
                ? '<i class="fas fa-eye-slash"></i>' 
                : '<i class="fas fa-eye"></i>';
        });

        function showAlert(type, text) {
            const alertBox = document.getElementById('alert-box');
            const alertIcon = document.getElementById('alert-icon');
            const alertText = document.getElementById('alert-text');

            alertBox.className = 'alertDiv ' + type;
            
            if (type === 'error') {
                alertIcon.innerHTML = '<i class="fas fa-exclamation-triangle"></i>';
            } else if (type === 'success') {
                alertIcon.innerHTML = '<i class="fas fa-check-circle"></i>';
            } else {
                alertIcon.innerHTML = '<i class="fas fa-bell"></i>';
            }

            alertText.textContent = text;
            alertBox.classList.add('show');

            setTimeout(() => {
                alertBox.classList.remove('show');
            }, 5000);
        }

        function isLoading(loading) {
            const btn = document.getElementById('submit-btn');
            if (loading) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            } else {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Authenticate Credentials';
            }
        }

        const gbtn = document.getElementById('google-btn')
        gbtn.addEventListener('click', (e) => {
            e.preventDefault();
            showAlert('success', 'Redirecting to sign-in securely using Google credentials...');
            setTimeout(window.location.href = gbtn.getAttribute('href') )
        });

        document.getElementById('forgot-password-link').addEventListener('click', (e) => {
            e.preventDefault();
            showAlert('error', 'Password reset functionality to be added');
        });

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                showAlert('error', 'Please provide both your Scholar ID and passcode.');
                return;
            }

            isLoading(true);

            const API_ENDPOINT = (window.API_URL) + '/api/login';

            fetch(API_ENDPOINT, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password })
            })
            .then(res => {
                return res.json();
            })
            .then(data => {
                isLoading(false);
                if (data.error) {
                    showAlert('error', data.error);
                } else if (data.token) {
                    showAlert('success', `Success! Welcome back, ${data.username || 'Scholar'}. Navigating to archive...`);
                    setTimeout(() =>{
                        window.location.href = '/dashboard/?params=' + data.token

                    }, 100)
                }
            })
            .catch(err => {
                setTimeout(() => {
                    isLoading(false);
                    showAlert('error',err.message);
                }, 1200);
            });
        });
    </script>
</body>
</html>
