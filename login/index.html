<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN | THE TUNU JOURNAL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/resources/base/base.js"></script>
    <style>
        :root { --paper: #f9f7f2; --ink: #1a1a1a; --border: #d4d4d4; }
        * { padding: 0px; margin: 0; box-sizing: border-box; }
        body {
            width: 100%;
            height: 100vh;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', serif;
        }
        #loginForm {
            background: white;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 95%;
            max-width: 350px;
            border: 1px solid var(--border);
        }
        .logo {
            margin: 10px auto;
            border: 1px solid var(--ink);
            object-fit: contain;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .input-field { position: relative; width: 100%; }
        .inp-icon { position: absolute; top: 12px; left: 10px; color: #666; }
        .inp input {
            width: 100%;
            padding: 12px 12px 12px 35px;
            border: 1px solid var(--border);
            outline: none;
        }
        .inp input:focus { outline: 1px solid var(--ink); }
        .btn {
            background: var(--ink);
            color: white;
            padding: 12px;
            width: 100%;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            font-family: sans-serif;
            font-weight: 600;
            margin: 0;
        }
        .btn:active { transform: scale(0.98); }
        .eye { position: absolute; top: 12px; right: 10px; cursor: pointer; color: #666; }
        .footer { margin-top: 20px; text-align: center; font-size: 0.8rem; color: #666; border-top: 1px solid var(--border); padding-top: 15px; }

        .page-links{
            display: flex;
            justify-content: space-between;
            a{font-size: small;
            color: rgb(0, 162, 255);}
            margin: 10px 0;
        }
        .google-btn{
            text-align: center;
            text-decoration: none;
            font-size: small;
            text-transform: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background: white;
            border: 1px solid black;
            color: black;
            user-select: none;
        }
        :disabled{
            background: grey !important;
            cursor: progress;

        }
        .alertDiv{
            gap: 10px;
            padding: 5px;
            border: 1px solid rgba(0, 0, 0, 0.122);
            font-size: small;
            display: none;
        }
        .show{
            display: flex;
        }
        .error{
            color: white;
            background: rgb(255, 0, 0);
        }
        .success{
            color: rgb(0, 0, 0);
            background: rgba(0, 255, 0, 0.355);
        }
        .alertIcon{
            animation: swing 1s infinite;
        }
        @keyframes swing {
            40%{
                rotate: 40deg;
            }
            70%{
                rotate: -40deg;
            }
            80%{
                rotate: 20deg;
            }
            
        }
    </style>
</head>
<body>
    <form id="loginForm">
        <div class="logo">TJ</div>
        <div style="text-align:center; font-weight:bolder; letter-spacing: 0.1em;">THE TUNU JOURNAL</div>

        <div class="alertDiv error">
            <div class="alertIcon">
                <i class="fas fa-bell"></i>
            </div>
            <div class="alertText">
                All fields are required
            </div>
        </div>

        <div class="input-field">
            <i class="fas fa-envelope inp-icon"></i>
            <div class="inp"><input type="text" id="email" placeholder="Email Address" required></div>
        </div>

        <div class="input-field">
            <i class="fas fa-lock inp-icon"></i>
            <div class="inp"><input type="password" id="password" placeholder="Password" required></div>
            <div class="eye"><i class="fas fa-eye"></i></div>
        </div>
        <div class="page-links">
            <a href="/forgot">Forgot Password?</a>
            <a href="/register"> Register</a>
        </div>

        <button class="btn submit" type="submit">
            <i style="margin-right: 10px;" class="fas fa-sign-in-alt"></i>            
            Login</button>

      <span style="text-align: center;">Or</span>

        <a class="btn google-btn" href="/google/login" type="button">
            <i style="color: orangered;" class="fab fa-google"></i>
            Login with Google</a>
        

        <div class="footer">
            Tunu Journal &copy; 2026. All Rights Reserved.
        </div>
    </form>

    <script>
        const eye = document.querySelector('.eye');
        const inp = document.querySelector('#password');
        eye.addEventListener('click', () => {
            inp.type = inp.type === 'password' ? 'text' : 'password';
            eye.innerHTML = inp.type === 'password' ? '<i class="fas fa-eye">' : '<i class="fas fa-eye-slash">';
        });

        document.querySelector('#loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim()
            const password = document.querySelector('#password').value.trim()

            console.log(email, password)
            if(!email || !password){
                showAlert('error', 'All fields are required')
            }
            isLoading(true)
            fetch(API_URL + '/api/login',{
                method:'POST',
                headers:{
                    'Content-Type':'application/json'
                },
                body:JSON.stringify({"email":email, "password":password})
            })
            .then(r=>r.json())
            .then(data=>{
                isLoading(false)
                if(data.error){
                    showAlert('error', data.error)
                }
                if(data.token && data.username && data.email){
                    alert(data)
                }
            })
            .catch(err=>{
                showAlert('error',err.message )
                isLoading(false)
            })
        });


        function isLoading(load){
            const btn = document.querySelector('.submit')
            if(load){
                btn.disabled = true
                btn.innerHTML = `
                <i class="fas fa-spinner fa-spin"></i>
                Loading...                
                `
            } else{
                btn.disabled = false
                btn.innerHTML = `
                <i class="fas fa-sign-in-alt"></i>
                Login              
                `
            }
        }



        function showAlert(type, text){
            const alertDiv = document.querySelector('.alertDiv')
            const icon = alertDiv.querySelector('.alertIcon')
            if(type == 'error'){
                icon.innerHTML = '<i class="fas fa-warning"></i>'
            } else{
                icon.innerHTML = '<i class="fas fa-check-circle"></i>'
            }
            if(alertDiv){
                alertDiv.className = 'alertDiv'
                alertDiv.classList.add(type)
                alertDiv.classList.toggle('show')
                alertDiv.querySelector('.alertText').textContent = text
                setTimeout(() =>{
                    alertDiv.classList.toggle('show')
                }, 5000)


            }

        }
    </script>
</body>
</html>
